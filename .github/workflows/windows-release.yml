name: Windows Release

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Create or update a GitHub Release from this manual run"
        required: true
        default: false
        type: boolean
      release_tag:
        description: "Release tag to create/update when publish_release is true, for example v0.1.0"
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows installer
    runs-on: windows-latest
    env:
      WINDOWS_CERTIFICATE_CONFIGURED: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 != '' && 'true' || 'false' }}

    steps:
      - name: Check out repository
        # actions/checkout v4
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Node.js
        # actions/setup-node v4
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Decode Windows signing certificate
        if: ${{ env.WINDOWS_CERTIFICATE_CONFIGURED == 'true' }}
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP "windows-codesign.pfx"
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
          "CSC_LINK=$certificatePath" >> $env:GITHUB_ENV
          "CSC_KEY_PASSWORD=$env:WINDOWS_CERTIFICATE_PASSWORD" >> $env:GITHUB_ENV

      - name: Disable signing when no certificate is configured
        if: ${{ env.WINDOWS_CERTIFICATE_CONFIGURED != 'true' }}
        shell: pwsh
        run: '"CSC_IDENTITY_AUTO_DISCOVERY=false" >> $env:GITHUB_ENV'

      - name: Validate manual release inputs
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release && inputs.release_tag == '' }}
        shell: pwsh
        run: |
          Write-Error "release_tag is required when publish_release is true."
          exit 1

      - name: Set package version from release tag
        if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release) }}
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          GITHUB_EVENT_NAME_FOR_RELEASE: ${{ github.event_name }}
          GITHUB_REF_NAME_FOR_RELEASE: ${{ github.ref_name }}
        run: |
          if ($env:GITHUB_EVENT_NAME_FOR_RELEASE -eq "workflow_dispatch") {
            $tag = $env:RELEASE_TAG
          } else {
            $tag = $env:GITHUB_REF_NAME_FOR_RELEASE
          }

          if ($tag -notmatch '^v(?<version>\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?)$') {
            Write-Error "Release tag must look like v1.2.3 or v1.2.3-beta.1. Got: $tag"
            exit 1
          }

          npm version $Matches.version --no-git-tag-version --allow-same-version

      - name: Build Windows installer
        run: npm run dist:win

      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          Get-ChildItem -Path release -File |
            Where-Object { $_.Name -like "*Setup*.exe" } |
            Sort-Object FullName |
            ForEach-Object {
              $hash = Get-FileHash -Algorithm SHA256 $_.FullName
              "$($hash.Hash.ToLowerInvariant())  $($_.Name)"
            } |
            Set-Content -Encoding ascii release\SHA256SUMS.txt

      - name: Upload workflow artifact
        # actions/upload-artifact v4
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-installer
          path: |
            release/*Setup*.exe
            release/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish GitHub release assets
        if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release) }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          GITHUB_EVENT_NAME_FOR_RELEASE: ${{ github.event_name }}
          GITHUB_REF_NAME_FOR_RELEASE: ${{ github.ref_name }}
        run: |
          if ($env:GITHUB_EVENT_NAME_FOR_RELEASE -eq "workflow_dispatch") {
            $tag = $env:RELEASE_TAG
          } else {
            $tag = $env:GITHUB_REF_NAME_FOR_RELEASE
          }
          if ($tag -notmatch '^v(?<version>\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?)$') {
            Write-Error "Release tag must look like v1.2.3 or v1.2.3-beta.1. Got: $tag"
            exit 1
          }
          $files = Get-ChildItem -Path release -File |
            Where-Object { $_.Name -like "*Setup*.exe" -or $_.Name -eq "SHA256SUMS.txt" } |
            ForEach-Object { $_.FullName }
          if (-not (gh release view $tag 2>$null)) {
            gh release create $tag --title $tag --notes "Windows installer build for $tag."
          }
          gh release upload $tag $files --clobber
